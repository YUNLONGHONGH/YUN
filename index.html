<!DOCTYPE html>
<html>
<head>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta charset="UTF-8" />
  <script src="https://aframe.io/releases/1.4.0/aframe.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.2/dist/mindar-image-aframe.prod.js"></script>
  <style>
    @font-face {
      font-family: 'Cubic11';
      src: url('./Cubic_11.ttf') format('truetype');
    }

    * { margin: 0; padding: 0; }
    body { overflow: hidden; }

    /* 教學文字 */
    #hint {
      position: fixed;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      background: rgba(30, 120, 200, 0.55);
      color: white;
      font-family: 'Cubic11', sans-serif;
      font-size: 22px;
      padding: 20px 32px;
      border-radius: 14px;
      border: 2px dashed white;
      z-index: 999;
      pointer-events: none;
      text-align: center;
      white-space: nowrap;
    }

    /* 按鈕區 */
    #ui {
      position: fixed;
      bottom: 80px;
      width: 100%;
      display: flex;
      justify-content: center;
      gap: 20px;
      z-index: 999;
      pointer-events: none;
    }

    .btn {
      pointer-events: auto;
      border: none;
      border-radius: 16px;
      padding: 18px 36px;
      font-size: 22px;
      font-weight: bold;
      font-family: 'Cubic11', sans-serif;
      cursor: pointer;
      box-shadow: 0 4px 0 rgba(0,0,0,0.3);
      display: none;
      overflow: hidden;
      white-space: nowrap;
    }

    #btn-next {
      background: linear-gradient(180deg, #a8e063 0%, #56ab2f 100%);
      color: white;
      text-shadow: 1px 1px 2px rgba(0,0,0,0.4);
      border-bottom: 4px solid #3a7a1e;
    }

    #btn-accept {
      background: linear-gradient(180deg, #ffd96a 0%, #f5a623 100%);
      color: white;
      text-shadow: 1px 1px 2px rgba(0,0,0,0.4);
      border-bottom: 4px solid #b87318;
    }

    #btn-confirm {
      background: linear-gradient(180deg, #f78fa7 0%, #e0195a 100%);
      color: white;
      text-shadow: 1px 1px 2px rgba(0,0,0,0.4);
      border-bottom: 4px solid #9e1140;
    }

    .btn:active {
      transform: translateY(3px);
      box-shadow: 0 1px 0 rgba(0,0,0,0.3);
      border-bottom-width: 1px;
    }
  </style>
</head>
<body>

<div id="hint">請把相機對準任務卡片</div>

<div id="ui">
  <button class="btn" id="btn-next"></button>
  <button class="btn" id="btn-accept"></button>
  <button class="btn" id="btn-confirm"></button>
</div>

<script>
// ═══════════════════════════
//  ★ 設定區 ★
// ═══════════════════════════
var FPS      = 24;
var S1_START = 0;
var S1_END   = 40;
var S2_START = 40;
var S2_END   = 80;
// ═══════════════════════════

var mixers = { m1: null, m2: null, m3: null };

AFRAME.registerComponent('mixer-tick', {
  tick: function(time, delta) {
    var d = delta / 1000;
    if (mixers.m1) mixers.m1.mixer.update(d);
    if (mixers.m2) mixers.m2.mixer.update(d);
    if (mixers.m3) mixers.m3.mixer.update(d);
  }
});
</script>

<a-scene
  mindar-image="imageTargetSrc: ./targets.mind; autoStart: true; uiLoading: no; uiScanning: no; uiError: no;"
  color-space="sRGB"
  renderer="colorManagement: true;"
  vr-mode-ui="enabled: false"
  device-orientation-permission-ui="enabled: false"
  mixer-tick
>
  <a-assets>
    <a-asset-item id="m1" src="./model1.glb"></a-asset-item>
    <a-asset-item id="m2" src="./model2.glb"></a-asset-item>
    <a-asset-item id="m3" src="./model3.glb"></a-asset-item>
  </a-assets>

  <a-camera position="0 0 0" look-controls="enabled: false"></a-camera>

  <a-entity mindar-image-target="targetIndex: 0">

    <a-gltf-model id="gltf1"
      src="#m1"
      position="0 0.05 0"
      scale="0.30 0.30 0.30"
      visible="false"
    ></a-gltf-model>

    <a-gltf-model id="gltf2"
      src="#m2"
      position="0 0.05 0"
      scale="0.30 0.30 0.30"
      visible="false"
    ></a-gltf-model>

    <a-gltf-model id="gltf3"
      src="#m3"
      position="0 0.05 0"
      scale="0.30 0.30 0.30"
      visible="false"
    ></a-gltf-model>

  </a-entity>
</a-scene>

<script>
var state = 'scanning';
var scene = document.querySelector('a-scene');
var hint  = document.getElementById('hint');

var btnNext    = document.getElementById('btn-next');
var btnAccept  = document.getElementById('btn-accept');
var btnConfirm = document.getElementById('btn-confirm');

var btnLabels = {
  'btn-next':    '下個 ▶',
  'btn-accept':  '接受',
  'btn-confirm': '確認'
};

function typeWriter(el, text, speed) {
  el.textContent = '';
  var i = 0;
  var timer = setInterval(function() {
    el.textContent += text[i];
    i++;
    if (i >= text.length) clearInterval(timer);
  }, speed || 80);
}

function showBtns() {
  var ids = Array.from(arguments);
  ['btn-next', 'btn-accept', 'btn-confirm'].forEach(function(id) {
    var el = document.getElementById(id);
    if (ids.indexOf(id) !== -1) {
      el.style.display = 'block';
      typeWriter(el, btnLabels[id], 80);
    } else {
      el.style.display = 'none';
    }
  });
}

function buildMixer(el, key, onReady) {
  var check = setInterval(function() {
    var comp = el.components['gltf-model'];
    if (comp && comp.model) {
      clearInterval(check);
      var root = comp.model.scene || comp.model;
      var mixer = new THREE.AnimationMixer(root);
      var clips = comp.model.animations || [];
      mixers[key] = { mixer: mixer, clips: clips };
      if (onReady) onReady();
    }
  }, 100);
}

function playClips(key, startF, endF, loop, onEnd) {
  var data = mixers[key];
  if (!data || data.clips.length === 0) {
    if (onEnd) setTimeout(onEnd, 500);
    return;
  }
  var mixer = data.mixer;
  var clips  = data.clips;
  mixer.stopAllAction();

  var realEnd = (endF === 999)
    ? Math.round(clips[0].duration * FPS)
    : endF;

  clips.forEach(function(clip) {
    var sub = THREE.AnimationUtils.subclip(clip, clip.name, startF, realEnd, FPS);
    var action = mixer.clipAction(sub);
    action.reset();
    action.time = 0;
    action.setLoop(loop ? THREE.LoopRepeat : THREE.LoopOnce, loop ? Infinity : 1);
    action.clampWhenFinished = !loop;
    action.play();
  });

  if (!loop && onEnd) {
    setTimeout(onEnd, ((realEnd - startF) / FPS) * 1000);
  }
}

scene.addEventListener('loaded', function() {
  var gltf1 = document.getElementById('gltf1');
  var gltf2 = document.getElementById('gltf2');
  var gltf3 = document.getElementById('gltf3');

  buildMixer(gltf1, 'm1', null);
  buildMixer(gltf2, 'm2', null);
  buildMixer(gltf3, 'm3', null);

  // 掃描到目標 → 隱藏教學文字，顯示 model1 + 下個按鈕
  var target = document.querySelector('[mindar-image-target]');
  target.addEventListener('targetFound', function() {
    if (state !== 'scanning') return;
    state = 'model1';
    hint.style.display = 'none';
    gltf1.setAttribute('visible', true);

    var try1 = function() {
      if (mixers.m1) {
        playClips('m1', 0, 999, true, null);
        showBtns('btn-next');
      } else {
        setTimeout(try1, 100);
      }
    };
    try1();
  });

  // 下個 ▶
  btnNext.addEventListener('click', function() {
    if (state !== 'model1') return;
    state = 'model2a';

    gltf1.setAttribute('visible', false);
    gltf2.setAttribute('visible', true);

    var try2 = function() {
      if (mixers.m2) {
        playClips('m2', S1_START, S1_END, true, null);
        showBtns('btn-accept', 'btn-confirm');
      } else {
        setTimeout(try2, 100);
      }
    };
    try2();
  });

  // 接受 / 確認
  function goModel2b() {
    if (state !== 'model2a') return;
    state = 'model2b';
    showBtns();

    playClips('m2', S2_START, S2_END, false, function() {
      state = 'model3';
      gltf2.setAttribute('visible', false);
      gltf3.setAttribute('visible', true);
      var try3 = function() {
        if (mixers.m3) playClips('m3', 0, 999, true, null);
        else setTimeout(try3, 100);
      };
      try3();
    });
  }

  btnAccept.addEventListener('click', goModel2b);
  btnConfirm.addEventListener('click', goModel2b);
});
</script>

</body>
</html>
