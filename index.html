<!DOCTYPE html>
<html>
<head>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta charset="UTF-8" />
  <script src="https://aframe.io/releases/1.4.0/aframe.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.2/dist/mindar-image-aframe.prod.js"></script>
  <style>
    @font-face {
      font-family: 'Cubic11';
      src: url('./Cubic_11.ttf') format('truetype');
    }

    * { margin: 0; padding: 0; }
    body { overflow: hidden; }

    /* 教學文字 */
    #hint {
      position: fixed;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      background: rgba(0,0,0,0.55);
      color: white;
      font-family: 'Cubic11', sans-serif;
      font-size: 22px;
      padding: 16px 28px;
      border-radius: 14px;
      z-index: 999;
      pointer-events: none;
      text-align: center;
      white-space: nowrap;
    }

    /* 按鈕區 */
    #ui {
      position: fixed;
      bottom: 80px;
      width: 100%;
      display: flex;
      justify-content: center;
      gap: 20px;
      z-index: 999;
      pointer-events: none;
    }

    .btn {
      pointer-events: auto;
      border: none;
      border-radius: 16px;
      padding: 18px 36px;
      font-size: 22px;
      font-weight: bold;
      font-family: 'Cubic11', sans-serif;
      cursor: pointer;
      box-shadow: 0 4px 0 rgba(0,0,0,0.3);
      display: none;
      overflow: hidden;
      white-space: nowrap;
    }

    #btn-next {
      background: linear-gradient(180deg, #a8e063 0%, #56ab2f 100%);
      color: white;
      text-shadow: 1px 1px 2px rgba(0,0,0,0.4);
      border-bottom: 4px solid #3a7a1e;
    }

    #btn-accept {
      background: linear-gradient(180deg, #ffd96a 0%, #f5a623 100%);
      color: white;
      text-shadow: 1px 1px 2px rgba(0,0,0,0.4);
      border-bottom: 4px solid #b87318;
    }

    #btn-confirm {
      background: linear-gradient(180deg, #f78fa7 0%, #e0195a 100%);
      color: white;
      text-shadow: 1px 1px 2px rgba(0,0,0,0.4);
      border-bottom: 4px solid #9e1140;
    }

    .btn:active {
      transform: translateY(3px);
      box-shadow: 0 1px 0 rgba(0,0,0,0.3);
      border-bottom-width: 1px;
    }
  </style>
</head>
<body>

<!-- 教學提示文字 -->
<div id="hint">請把相機對準任務卡片</div>

<!-- 按鈕 -->
<div id="ui">
  <button class="btn" id="btn-next"></button>
  <button class="btn" id="btn-accept"></button>
  <button class="btn" id="btn-confirm"></button>
</div>

<script>
// ═══════════════════════════
//  ★ 設定區 ★
// ═══════════════════════════
var FPS      = 24;
var S1_START = 0;
var S1_END   = 40;
var S2_START = 40;
var S2_END   = 80;
// ═══════════════════════════

var mixers = { m1: null, m2: null, m3: null };

AFRAME.registerComponent('mixer-tick', {
  tick: function(time, delta) {
    var d = delta / 1000;
    if (mixers.m1) mixers.m1.mixer.update(d);
    if (mixers.m2) mixers.m2.mixer.update(d);
    if (mixers.m3) mixers.m3.mixer.update(d);
  }
});
</script>

<a-scene
  mindar-image="imageTargetSrc: ./targets.mind; autoStart: true; uiLoading: no; uiScanning: no; uiError: no;"
  color-space="sRGB"
  renderer="colorManagement: true;"
  vr-mode-ui="enabled: false"
  device-orientation-permission-ui="enabled: false"
  mixer-tick
>
  <a-assets>
    <a-asset-item id="m1" src="./model1.glb"></a-asset-item>
    <a-asset-item id="m2" src="./model2.glb"></a-asset-item>
    <a-asset-item id="m3" src="./model3.glb"></a-asset-item>
  </a-assets>

  <a-camera position="0 0 0" look-controls="enabled: false"></a-camera>

  <a-entity mindar-image-target="targetIndex: 0">

    <a-gltf-model id="gltf1"
      src="#m1"
      position="0 0.05 0"
      scale="0.30 0.30 0.30"
      visible="false"
    ></a-gltf-model>
