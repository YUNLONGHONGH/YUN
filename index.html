<!DOCTYPE html>
<html>
<head>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta charset="UTF-8" />
  <script src="https://aframe.io/releases/1.4.0/aframe.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.2/dist/mindar-image-aframe.prod.js"></script>
  <style>
    * { margin: 0; padding: 0; }
    body { overflow: hidden; }

    #ui {
      position: fixed;
      bottom: 80px;
      width: 100%;
      display: flex;
      justify-content: center;
      gap: 20px;
      z-index: 999;
      pointer-events: none;
    }

    .btn {
      pointer-events: auto;
      border: none;
      border-radius: 16px;
      padding: 18px 36px;
      font-size: 22px;
      font-weight: bold;
      cursor: pointer;
      box-shadow: 0 4px 0 rgba(0,0,0,0.3);
      display: none;
    }

    #btn-next {
      background: linear-gradient(180deg, #a8e063 0%, #56ab2f 100%);
      color: white;
      text-shadow: 1px 1px 2px rgba(0,0,0,0.4);
      border-bottom: 4px solid #3a7a1e;
    }

    #btn-accept {
      background: linear-gradient(180deg, #ffd96a 0%, #f5a623 100%);
      color: white;
      text-shadow: 1px 1px 2px rgba(0,0,0,0.4);
      border-bottom: 4px solid #b87318;
    }

    #btn-confirm {
      background: linear-gradient(180deg, #f78fa7 0%, #e0195a 100%);
      color: white;
      text-shadow: 1px 1px 2px rgba(0,0,0,0.4);
      border-bottom: 4px solid #9e1140;
    }

    .btn:active {
      transform: translateY(3px);
      box-shadow: 0 1px 0 rgba(0,0,0,0.3);
      border-bottom-width: 1px;
    }

    /* debug */
    #debug {
      position: fixed;
      top: 0; left: 0;
      background: rgba(0,0,0,0.75);
      color: #0f0;
      font-size: 13px;
      padding: 6px 10px;
      z-index: 9999;
      max-height: 40vh;
      overflow-y: auto;
      width: 100%;
      pointer-events: none;
    }
  </style>
</head>
<body>

<div id="debug">啟動中...<br></div>

<div id="ui">
  <button class="btn" id="btn-next">下個 ▶</button>
  <button class="btn" id="btn-accept">接受</button>
  <button class="btn" id="btn-confirm">確認</button>
</div>

<script>
function log(msg) {
  var d = document.getElementById('debug');
  d.innerHTML += msg + '<br>';
  console.log(msg);
}

var FPS      = 24;
var S1_START = 0;
var S1_END   = 20;
var S2_START = 20;
var S2_END   = 60;

var mixers = { m1: null, m2: null, m3: null };

AFRAME.registerComponent('mixer-tick', {
  tick: function(time, delta) {
    var d = delta / 1000;
    if (mixers.m1) mixers.m1.mixer.update(d);
    if (mixers.m2) mixers.m2.mixer.update(d);
    if (mixers.m3) mixers.m3.mixer.update(d);
  }
});
</script>

<a-scene
  mindar-image="imageTargetSrc: ./targets.mind; autoStart: true; uiLoading: no; uiScanning: no; uiError: no;"
  color-space="sRGB"
  renderer="colorManagement: true;"
  vr-mode-ui="enabled: false"
  device-orientation-permission-ui="enabled: false"
  mixer-tick
>
  <a-assets timeout="30000">
    <a-asset-item id="m1" src="./model1.glb"></a-asset-item>
    <a-asset-item id="m2" src="./model2.glb"></a-asset-item>
    <a-asset-item id="m3" src="./model3.glb"></a-asset-item>
  </a-assets>

  <a-camera position="0 0 0" look-controls="enabled: false"></a-camera>

  <a-entity mindar-image-target="targetIndex: 0">

    <a-gltf-model id="gltf1"
      src="#m1"
      position="0 0.05 0"
      scale="0.15 0.15 0.15"
      visible="true"
    ></a-gltf-model>

    <a-gltf-model id="gltf2"
      src="#m2"
      position="0 0.05 0"
      scale="0.15 0.15 0.15"
      visible="false"
    ></a-gltf-model>

    <a-gltf-model id="gltf3"
      src="#m3"
      position="0 0.05 0"
      scale="0.15 0.15 0.15"
      visible="false"
    ></a-gltf-model>

  </a-entity>
</a-scene>

<script>
var state = 'model1';
var scene = document.querySelector('a-scene');

var btnNext    = document.getElementById('btn-next');
var btnAccept  = document.getElementById('btn-accept');
var btnConfirm = document.getElementById('btn-confirm');

function showBtns() {
  var ids = Array.from(arguments);
  ['btn-next', 'btn-accept', 'btn-confirm'].forEach(function(id) {
    document.getElementById(id).style.display =
      ids.indexOf(id) !== -1 ? 'block' : 'none';
  });
}

function buildMixer(el, key, onReady) {
  var check = setInterval(function() {
    var comp = el.components['gltf-model'];
    if (comp && comp.model) {
      clearInterval(check);
      var root = comp.model.scene || comp.model;
      var mixer = new THREE.AnimationMixer(root);
      var clips = comp.model.animations || [];
      mixers[key] = { mixer: mixer, clips: clips };
      log('✅ ' + key + ' ready, clips: ' + clips.length);
      if (onReady) onReady();
    }
  }, 100);
}

function playClips(key, startF, endF, loop, onEnd) {
  var data = mixers[key];
  if (!data || data.clips.length === 0) {
    log('⚠️ ' + key + ' no clips');
    if (onEnd) setTimeout(onEnd, 500);
    return;
  }
  var mixer = data.mixer;
  var clips = data.clips;
  mixer.stopAllAction();

  var realEnd = (endF === 999)
    ? Math.round(clips[0].duration * FPS)
    : endF;

  clips.forEach(function(clip) {
    var sub = THREE.AnimationUtils.subclip(clip, clip.name, startF, realEnd, FPS);
    var action = mixer.clipAction(sub);
    action.reset();
    action.time = 0;
    action.setLoop(loop ? THREE.LoopRepeat : THREE.LoopOnce, loop ? Infinity : 1);
    action.clampWhenFinished = !loop;
    action.play();
  });

  if (!loop && onEnd) {
    setTimeout(onEnd, ((realEnd - startF) / FPS) * 1000);
  }
}

// debug：監聽載入事件
document.querySelector('a-assets').addEventListener('loaded', function() {
  log('✅ a-assets 全部載入');
});
['gltf1','gltf2','gltf3'].forEach(function(id) {
  var el = document.getElementById(id);
  el.addEventListener('model-loaded', function() { log('✅ ' + id + ' 模型載入'); });
  el.addEventListener('model-error',  function() { log('❌ ' + id + ' 模型錯誤'); });
});
scene.addEventListener('arReady', function() { log('✅ MindAR arReady — 相機啟動'); });
scene.addEventListener('arError', function(e) { log('❌ MindAR arError: ' + JSON.stringify(e.detail)); });

log('📄 頁面載入，等待 AR...');

scene.addEventListener('loaded', function() {
  log('✅ a-scene loaded');

  var gltf1 = document.getElementById('gltf1');
  var gltf2 = document.getElementById('gltf2');
  var gltf3 = document.getElementById('gltf3');

  // Model1 載入後循環播放，顯示「下個」按鈕
  buildMixer(gltf1, 'm1', function() {
    playClips('m1', 0, 999, true, null);
    showBtns('btn-next');
  });

  buildMixer(gltf2, 'm2', null);
  buildMixer(gltf3, 'm3', null);

  // ── 下個 ▶ ──
  btnNext.addEventListener('click', function() {
    if (state !== 'model1') return;
    state = 'model2a';
    showBtns();

    gltf1.setAttribute('visible', false);
    gltf2.setAttribute('visible', true);
    log('▶ 切換 model2，播 0~20');

    var try2 = function() {
      if (mixers.m2) {
        playClips('m2', S1_START, S1_END, false, function() {
          state = 'model2b_ready';
          showBtns('btn-accept', 'btn-confirm');
          log('⏸ model2 0~20 播完，顯示接受/確認');
        });
      } else {
        setTimeout(try2, 100);
      }
    };
    try2();
  });

  // ── 接受 / 確認 ──
  function goModel2b() {
    if (state !== 'model2b_ready') return;
    state = 'model2b';
    showBtns();
    log('▶ 播 model2 20~60');

    playClips('m2', S2_START, S2_END, false, function() {
      state = 'model3';
      gltf2.setAttribute('visible', false);
      gltf3.setAttribute('visible', true);
      log('▶ 切換 model3');
      var try3 = function() {
        if (mixers.m3) playClips('m3', 0, 999, true, null);
        else setTimeout(try3, 100);
      };
      try3();
    });
  }

  btnAccept.addEventListener('click', goModel2b);
  btnConfirm.addEventListener('click', goModel2b);
});
</script>

</body>
</html>
